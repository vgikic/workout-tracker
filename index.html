<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lift Log</title>
  <meta name="description" content="Personal workout and body weight tracker">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <script>
    // apply saved theme before first paint to avoid a flash
    try {
      var l = JSON.parse(localStorage.getItem('wt.local.v1') || '{}');
      if (l.theme === 'dark' || l.theme === 'light') document.documentElement.setAttribute('data-theme', l.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Lift Log</div>
      <nav class="nav nav-top" id="nav-top"></nav>
      <div class="sync-status" id="sync-status" title="Sync status"></div>
    </header>
    <main id="view" class="view"></main>
    <nav class="nav nav-bottom" id="nav-bottom"></nav>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="./vendor/chart.umd.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
